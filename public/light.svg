<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 600" width="100%" height="100%">
  <!-- Pure white background -->
  
  
  <g fill="#000000" fill-rule="evenodd">
    <!-- 
      Letter 'P'
      Constructed with a heavy monolithic stem and upper block.
      Features an aggressive 45-degree angular cut in the negative space.
    -->
    <path d="M 100 100 
             L 350 100 
             L 350 350 
             L 200 350 
             L 200 500 
             L 100 500 
             Z 
             M 200 200 
             L 200 300 
             L 250 250 
             L 250 200 
             Z" data-index="0" style="opacity: 1; visibility: visible; fill: rgb(255, 255, 255);"></path>

    <!-- 
      Letter 'R'
      Mirrors the 'P' structure for rhythmic symmetry, but extends 
      a powerful 45-degree diagonal leg that creates dynamic forward momentum.
    -->
    <path d="M 400 100 
             L 650 100 
             L 650 350 
             L 800 500 
             L 650 500 
             L 500 350 
             L 500 500 
             L 400 500 
             Z 
             M 500 200 
             L 500 300 
             L 550 250 
             L 550 200 
             Z" data-index="1" style="opacity: 1; visibility: visible; fill: rgb(255, 255, 255);"></path>

    <!-- 
      Number '5'
      A heavily stylized, blocky form. The bottom left corner is diagonally 
      sliced at exactly 45 degrees to perfectly nest with the extending 
      leg of the 'R', creating a unified, laser-cut monogram aesthetic.
    -->
    <path d="M 700 100 
             L 950 100 
             L 950 200 
             L 800 200 
             L 800 250 
             L 950 250 
             L 950 500 
             L 850 500 
             L 750 400 
             L 850 400 
             L 850 350 
             L 700 350 
             Z" data-index="2" style="opacity: 1; visibility: visible; fill: rgb(255, 255, 255);"></path>
  </g>
</svg>